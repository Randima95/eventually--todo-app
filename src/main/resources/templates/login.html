<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in | eventually!</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body class="auth-page">
<main class="auth-shell">
    <section class="auth-brand">
        <p class="eyebrow">YOUR PERSONAL TASK SPACE</p>
        <h1>eventually<span>!</span></h1>
        <p>Make room for what matters. Plan it, track it, and finish it.</p>
    </section>

    <section class="auth-card">
        <p class="eyebrow">WELCOME BACK</p>
        <h2>Sign in to your tasks</h2>

        <div th:if="${param.error}" class="alert error">
            Invalid username or password.
        </div>

        <div th:if="${param.logout}" class="alert success">
            You have been signed out.
        </div>

        <div th:if="${param.registered}" class="alert success">
            Account created. Please sign in.
        </div>

        <form th:action="@{/login}" method="post" class="auth-form">
            <label>
                Username
                <input name="username" type="text" autocomplete="username" required autofocus>
            </label>

            <label>
                Password
                <input name="password" type="password" autocomplete="current-password" required>
            </label>

            <button class="primary-button full-width" type="submit">Sign in</button>
        </form>

        <p class="auth-footer">
            New here? <a th:href="@{/register}">Create an account</a>
        </p>
    </section>
</main>
</body>
</html>
